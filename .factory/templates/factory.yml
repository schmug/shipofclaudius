# Software factory — scheduler + driver + gated landing.  TEMPLATE: copy to
# `.github/workflows/factory.yml` in the ADOPTING repo and fill the three marked values.
#
# This is L4 (scheduler) and L1 (gate) of the architecture in
# docs/specs/2026-08-05-software-factory-design.md §4. It exists as a versioned, diffable,
# REVERTABLE file in the target repo on purpose — that is the whole reason the factory runs on
# GitHub Actions rather than a claude.ai Routine, which lives in no repo and cannot be reviewed or
# rolled back.
#
# THREE THINGS TO FILL IN BEFORE THIS RUNS:
#   1. `FACTORY_PLUGIN_REPO` — the repo hosting the shipofclaudius plugin (the gate lives there).
#   2. `secrets.FACTORY_GH_TOKEN` — a WRITE-scoped token whose identity is DISTINCT from the code
#      owner's. GitHub forbids self-approval, so a token acting as the code owner can never satisfy
#      a CODEOWNERS review requirement. See dmarcheck #299.
#   3. `secrets.ANTHROPIC_API_KEY` — for the `advance` job's `claude -p` driver.
#
# ⚠️ `pull_request_target` RUNS WITH REPOSITORY WRITE ACCESS. This workflow therefore NEVER checks
# out, builds, or executes the pull request's code — the `land` job checks out the BASE ref only,
# and the gate is a pure Node program with zero dependencies and no install step. Do not add a
# build, an `npm install`, or a `ref: ${{ github.event.pull_request.head.sha }}` to that job: doing
# so hands repository write access to whoever opened the PR.

name: Software factory

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]          # the human-minted `fix-verified` trust token arrives here
  schedule:
    - cron: "0 */4 * * *"     # drain the queue four-hourly
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to advance (blank = take the oldest from the factory queue)"
        required: false
        type: string
      stop_after:
        description: "Advance at most this far: reproduce | diagnose | verify | fix"
        required: false
        default: fix
        type: string

# Never cancel a run mid-write: a cancelled `advance` can leave a half-pushed branch, and a
# cancelled `land` can leave a merge in an unknown state.
concurrency:
  group: factory-${{ github.event.issue.number || github.event.pull_request.number || 'cron' }}
  cancel-in-progress: false

# Least privilege at the top; each job elevates explicitly to exactly what it needs.
permissions:
  contents: read

env:
  # 1. FILL IN: the repo hosting the shipofclaudius plugin.
  FACTORY_PLUGIN_REPO: schmug/shipofclaudius
  # Pin to a commit SHA once you have one you trust. `main` is acceptable ONLY because this is
  # your own first-party repo; for any third-party source a SHA is mandatory.
  FACTORY_PLUGIN_REF: main

jobs:
  # ── 1. KILL SWITCH ───────────────────────────────────────────────────────────────────────────
  # Cheap, model-free, and FIRST. Every other job `needs:` it. A human pauses the entire factory by
  # applying `pipeline-paused` to any open issue — no PR, no redeploy, no waiting for a maintainer.
  killswitch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
      pull-requests: read
    outputs:
      paused: ${{ steps.check.outputs.paused }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          n="$(gh issue list --label pipeline-paused --state open --limit 1 --json number --jq 'length')"
          if [ "$n" != "0" ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Factory PAUSED — an open issue carries \`pipeline-paused\`. Remove it to resume."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. ADVANCE ───────────────────────────────────────────────────────────────────────────────
  # L3, the driver: one `claude -p` run advances ONE issue by at most one phase, then writes the
  # resulting label transition back. Stateless by design — all state is labels + the committed
  # report.md, so an interrupted run loses nothing and the next run resumes.
  advance:
    needs: killswitch
    if: >-
      needs.killswitch.outputs.paused == 'false' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        (github.event.label.name == 'factory' || github.event.label.name == 'needs-repro')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read          # the write token below carries the elevated scopes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install the factory plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FACTORY_PLUGIN_REPO }}
          ref: ${{ env.FACTORY_PLUGIN_REF }}
          path: .factory-plugin
          token: ${{ secrets.FACTORY_GH_TOKEN }}

      - name: Advance one issue
        env:
          # 2. FILL IN: WRITE-scoped, and a DISTINCT identity from the code owner (GitHub forbids
          # self-approval, so a code-owner token can never satisfy a CODEOWNERS requirement).
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          # 3. FILL IN.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/.factory-plugin
          FACTORY_ISSUE: ${{ github.event.issue.number || inputs.issue }}
          FACTORY_STOP_AFTER: ${{ inputs.stop_after || 'fix' }}
          FACTORY_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code

          # `routine-anti-noise` runs FIRST, as a mandatory gate: it is the purpose-built fix for
          # the double-fire class of bug (six duplicate PRs from one issue) and it honours
          # human-applied hold labels. The factory workflow's own idempotency preflight is the
          # second line of defence, not a replacement for this one.
          claude -p --permission-mode acceptEdits "
          Run the routine-anti-noise skill on issue ${FACTORY_ISSUE:-(the oldest factory-queue issue)}
          in ${FACTORY_REPO}. If it returns skip:true, STOP and report the reason — do nothing else.

          Otherwise run the factory-issue-fix skill with:
            issue: ${FACTORY_ISSUE:-(omit — let it self-bootstrap from the factory queue)}
            repo: ${FACTORY_REPO}
            stopAfter: ${FACTORY_STOP_AFTER}

          Then apply the returned transition.labels with gh (add and remove exactly what it lists,
          nothing else) and post transition.comment as an issue comment if it is non-empty. Commit
          the returned report as report.md on the factory branch if that branch exists. Do NOT
          merge anything, do NOT mark any PR ready, and do NOT push to the default branch.
          " 2>&1 | tee advance.log

  # ── 3. LAND ──────────────────────────────────────────────────────────────────────────────────
  # L1, the gate. NO MODEL RUNS IN THIS JOB AT ALL. It is `gh` + a zero-dependency Node program, so
  # an instruction injected into an issue or PR body has nothing to act on — it cannot move a `<=`.
  land:
    needs: killswitch
    if: >-
      needs.killswitch.outputs.paused == 'false' &&
      github.event_name == 'pull_request_target' &&
      github.event.label.name == 'fix-verified'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # THE GATE-FROM-MAIN INVARIANT. Check out the BASE ref, never the PR head: the rules a PR is
      # judged by must not be editable by that PR. `.factory/**` and `.github/workflows/**` are on
      # the gate's MANDATORY denylist too, so even a mis-wired checkout escalates rather than merges.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The gate itself, from the plugin — versioned independently of the repo it judges.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FACTORY_PLUGIN_REPO }}
          ref: ${{ env.FACTORY_PLUGIN_REF }}
          path: .factory-plugin
          token: ${{ secrets.FACTORY_GH_TOKEN }}
          persist-credentials: false

      - name: Build the gate input
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          set -euo pipefail
          node .factory-plugin/packages/factory-gate/bin/build-input.mjs \
            --pr "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --base "${{ github.event.pull_request.base.ref }}" \
            --out gate-input.json

      # Exit 0 = merge, 2 = escalate, 1 = the gate itself broke. Three DISTINCT codes on purpose:
      # "the gate broke" must never be read as either answer. `|| true` here only captures the
      # code — the explicit comparisons below are what decide, and anything that is not 0 escalates.
      - name: Run the gate
        id: gate
        run: |
          set -uo pipefail
          CONFIG_ARG=""
          # `.factory/gate.json` in this working tree came from the BASE checkout above.
          [ -f .factory/gate.json ] && CONFIG_ARG="--config .factory/gate.json"
          node .factory-plugin/packages/factory-gate/bin/gate.mjs \
            --input gate-input.json $CONFIG_ARG \
            --config-source "${{ github.event.pull_request.base.ref }}@${{ github.sha }}" \
            --verdict-out verdict.json --comment-out comment.md
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Post the audit comment
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          set -euo pipefail
          [ -f comment.md ] || printf '### Factory gate — ⛔ escalate\n\nThe gate could not produce a verdict (exit %s).\n' \
            "${{ steps.gate.outputs.code }}" > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body-file comment.md

      - name: Squash-merge (only on a clean pass)
        if: steps.gate.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          set -euo pipefail
          # No --admin (it would bypass the very protections the gate mirrors) and no
          # --delete-branch (a predecessor in a stack may still need the ref).
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --squash

      - name: Escalate
        if: steps.gate.outputs.code != '0'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          set -euo pipefail
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --add-label needs-you || true
          if [ "${{ steps.gate.outputs.code }}" = "1" ]; then
            echo "::error::The factory gate FAILED TO RUN (exit 1). This is not a verdict — investigate before re-running."
            exit 1
          fi
          echo "::notice::Gate escalated (exit 2) — see the audit comment on the PR. Merged nothing."
