# Software factory — scheduler + driver + gated landing.  TEMPLATE: copy to
# `.github/workflows/factory.yml` in the ADOPTING repo and fill the three marked values.
#
# This is L4 (scheduler) and L1 (gate) of the architecture in
# docs/specs/2026-08-05-software-factory-design.md §4. It exists as a versioned, diffable,
# REVERTABLE file in the target repo on purpose — that is the whole reason the factory runs on
# GitHub Actions rather than a claude.ai Routine, which lives in no repo and cannot be reviewed or
# rolled back.
#
# THREE THINGS TO FILL IN BEFORE THIS RUNS:
#   1. `FACTORY_PLUGIN_REPO` — the repo hosting the shipofclaudius plugin (the gate lives there).
#   2. `secrets.FACTORY_GH_TOKEN` — a WRITE-scoped token whose identity is DISTINCT from the code
#      owner's. GitHub forbids self-approval, so a token acting as the code owner can never satisfy
#      a CODEOWNERS review requirement. See dmarcheck #299.
#   3. `secrets.ANTHROPIC_API_KEY` — for the `advance` job's `claude -p` driver.
#
# ⚠️ `pull_request_target` RUNS WITH REPOSITORY WRITE ACCESS. This workflow therefore NEVER checks
# out, builds, or executes the pull request's code — the `land` job checks out the BASE ref only,
# and the gate is a pure Node program with zero dependencies and no install step. Do not add a
# build, an `npm install`, or a `ref: ${{ github.event.pull_request.head.sha }}` to that job: doing
# so hands repository write access to whoever opened the PR.

name: Software factory

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]          # the human-minted `fix-verified` trust token arrives here
  pull_request:
    types: [opened, synchronize, reopened]   # UNPRIVILEGED — runs the fixture-evidence producer
  schedule:
    - cron: "0 */4 * * *"     # drain the queue four-hourly
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to advance (blank = take the oldest from the factory queue)"
        required: false
        type: string
      stop_after:
        description: "Advance at most this far: reproduce | diagnose | verify | fix"
        required: false
        default: fix
        type: string

# Never cancel a run mid-write: a cancelled `advance` can leave a half-pushed branch, and a
# cancelled `land` can leave a merge in an unknown state.
concurrency:
  group: factory-${{ github.event.issue.number || github.event.pull_request.number || 'cron' }}
  cancel-in-progress: false

# Least privilege at the top; each job elevates explicitly to exactly what it needs.
permissions:
  contents: read

env:
  # 1. FILL IN: the repo hosting the shipofclaudius plugin.
  FACTORY_PLUGIN_REPO: schmug/shipofclaudius
  # Pin to a commit SHA once you have one you trust. `main` is acceptable ONLY because this is
  # your own first-party repo; for any third-party source a SHA is mandatory.
  FACTORY_PLUGIN_REF: main

jobs:
  # ── 1. KILL SWITCH ───────────────────────────────────────────────────────────────────────────
  # Cheap, model-free, and FIRST. Every other job `needs:` it. A human pauses the entire factory by
  # applying `pipeline-paused` to any open issue — no PR, no redeploy, no waiting for a maintainer.
  killswitch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
      pull-requests: read
    outputs:
      paused: ${{ steps.check.outputs.paused }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          n="$(gh issue list --label pipeline-paused --state open --limit 1 --json number --jq 'length')"
          if [ "$n" != "0" ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Factory PAUSED — an open issue carries \`pipeline-paused\`. Remove it to resume."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. ADVANCE ───────────────────────────────────────────────────────────────────────────────
  # L3, the driver: one `claude -p` run advances ONE issue by at most one phase, then writes the
  # resulting label transition back. Stateless by design — all state is labels + the committed
  # report.md, so an interrupted run loses nothing and the next run resumes.
  advance:
    needs: killswitch
    if: >-
      needs.killswitch.outputs.paused == 'false' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        (github.event.label.name == 'factory' || github.event.label.name == 'needs-repro')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read          # the write token below carries the elevated scopes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install the factory plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FACTORY_PLUGIN_REPO }}
          ref: ${{ env.FACTORY_PLUGIN_REF }}
          path: .factory-plugin
          token: ${{ secrets.FACTORY_GH_TOKEN }}

      - name: Advance one issue
        env:
          # 2. FILL IN: WRITE-scoped, and a DISTINCT identity from the code owner (GitHub forbids
          # self-approval, so a code-owner token can never satisfy a CODEOWNERS requirement).
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          # 3. FILL IN.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/.factory-plugin
          FACTORY_ISSUE: ${{ github.event.issue.number || inputs.issue }}
          FACTORY_STOP_AFTER: ${{ inputs.stop_after || 'fix' }}
          FACTORY_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Validate the dispatch inputs before they reach the model's prompt. Shell parameter
          # expansion does not re-scan its result, so these cannot become shell — but they CAN
          # become instructions to an agent, and an allowlist is cheaper than reasoning about that.
          if [ -n "${FACTORY_ISSUE}" ]; then
            case "${FACTORY_ISSUE}" in
              ''|*[!0-9]*) echo "::error::issue must be a positive integer"; exit 1 ;;
            esac
          fi
          case "${FACTORY_STOP_AFTER}" in
            reproduce|diagnose|verify|fix) ;;
            *) echo "::error::stop_after must be one of reproduce|diagnose|verify|fix"; exit 1 ;;
          esac

          npm install -g @anthropic-ai/claude-code

          # `routine-anti-noise` runs FIRST, as a mandatory gate: it is the purpose-built fix for
          # the double-fire class of bug (six duplicate PRs from one issue) and it honours
          # human-applied hold labels. The factory workflow's own idempotency preflight is the
          # second line of defence, not a replacement for this one.
          claude -p --permission-mode acceptEdits "
          Run the routine-anti-noise skill on issue ${FACTORY_ISSUE:-(the oldest factory-queue issue)}
          in ${FACTORY_REPO}. If it returns skip:true, STOP and report the reason — do nothing else.

          Otherwise run the factory-issue-fix skill with:
            issue: ${FACTORY_ISSUE:-(omit — let it self-bootstrap from the factory queue)}
            repo: ${FACTORY_REPO}
            stopAfter: ${FACTORY_STOP_AFTER}

          Then apply the returned transition.labels with gh (add and remove exactly what it lists,
          nothing else) and post transition.comment as an issue comment if it is non-empty. Commit
          the returned report as report.md on the factory branch if that branch exists. Do NOT
          merge anything, do NOT mark any PR ready, and do NOT push to the default branch.
          " 2>&1 | tee advance.log

  # ── 3. LAND ──────────────────────────────────────────────────────────────────────────────────
  # L1, the gate. NO MODEL RUNS IN THIS JOB AT ALL. It is `gh` + a zero-dependency Node program, so
  # an instruction injected into an issue or PR body has nothing to act on — it cannot move a `<=`.
  # ── Condition 9's evidence producer (#64) ────────────────────────────────────────────────────
  # Condition 9 asks whether the committed fixture was RED on the base and GREEN on the head. That
  # answer must come from OBSERVED PROCESS EXIT CODES, never from the fix agent's self-report — the
  # agent that wrote the code cannot also be the witness that it works. This job is the witness.
  #
  # IT RUNS ON `pull_request`, NOT `pull_request_target`, AND THAT IS THE WHOLE POINT. Producing
  # evidence requires CHECKING OUT AND RUNNING THE PR's CODE. On `pull_request` that happens with a
  # read-only token and no access to secrets, so running author-written code is safe. The `land`
  # job below is `pull_request_target` with write access and MUST NEVER check out the head; it only
  # downloads this job's artifact. Do not merge these two jobs.
  #
  # The evidence cannot instead be committed by the fix agent: `.factory/**` is on the gate's
  # MANDATORY denylist (packages/factory-gate/src/config.mjs), so a PR carrying its own evidence
  # there fails condition 5 by construction. An artifact is the only non-author-writable transport.
  fixture-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # 2. FILL IN: how this repo names and runs ONE test. The default reads a `Fixture-Test:`
      #    trailer from the PR body, which is what factory-issue-fix writes. If your repo names
      #    fixtures differently, change this parser and the two run commands together.
      - name: Resolve the fixture test named by the PR
        id: fixture
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          # The body is UNTRUSTED, author-written text. It reaches the shell only via env (never
          # interpolated into the script), and is constrained to a conservative charset before
          # being used as a command argument.
          raw="$(printf '%s' "$PR_BODY" | grep -m1 -oE '^Fixture-Test:[[:space:]]*[A-Za-z0-9_./: -]+' | sed 's/^Fixture-Test:[[:space:]]*//' || true)"
          if [ -z "${raw:-}" ]; then
            echo "No Fixture-Test trailer in the PR body — no evidence can be produced."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "test=$raw" >> "$GITHUB_OUTPUT"
          echo "Fixture test: $raw"

      # The exit code IS the evidence. `|| rc=$?` for the same reason the gate step uses it: these
      # blocks run as `bash -e`, so a non-zero exit would abort the step before we could record it —
      # and a FAILING test on the base is precisely the outcome this step exists to observe.
      - name: Run the fixture on the BASE ref (expect RED)
        if: steps.fixture.outputs.found == 'true'
        id: base
        env:
          FIXTURE_TEST: ${{ steps.fixture.outputs.test }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          git checkout --quiet --detach "$BASE_SHA"
          rc=0
          # 3. FILL IN: the command that runs exactly the one test named in FIXTURE_TEST.
          npm test -- "$FIXTURE_TEST" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "Base exit: $rc (NON-ZERO is what we want — the fixture must encode the bug)"

      - name: Run the fixture on the PR HEAD (expect GREEN)
        if: steps.fixture.outputs.found == 'true'
        id: head
        env:
          FIXTURE_TEST: ${{ steps.fixture.outputs.test }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          git checkout --quiet --detach "$HEAD_SHA"
          rc=0
          npm test -- "$FIXTURE_TEST" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "Head exit: $rc (ZERO is what we want — the fix closes the bug)"

      # redOnBase / greenOnHead are pure functions of the two exit codes above. No prose is parsed
      # and no agent field is consulted. source:"ci" is the provenance marker the gate requires.
      - name: Write factory-evidence.json
        if: steps.fixture.outputs.found == 'true'
        env:
          FIXTURE_TEST: ${{ steps.fixture.outputs.test }}
          BASE_RC: ${{ steps.base.outputs.rc }}
          HEAD_RC: ${{ steps.head.outputs.rc }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs");
            const out={schema:1,source:"ci",fixtureTest:process.env.FIXTURE_TEST,
              redOnBase:process.env.BASE_RC!=="0",greenOnHead:process.env.HEAD_RC==="0",
              baseSha:process.env.BASE_SHA,headSha:process.env.HEAD_SHA,runId:process.env.GITHUB_RUN_ID};
            fs.writeFileSync("factory-evidence.json",JSON.stringify(out,null,2)+"\n");
            console.error("evidence: "+JSON.stringify(out));'

      - name: Upload the evidence artifact
        if: steps.fixture.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factory-evidence
          path: factory-evidence.json
          retention-days: 7

  land:
    needs: killswitch
    if: >-
      needs.killswitch.outputs.paused == 'false' &&
      github.event_name == 'pull_request_target' &&
      github.event.label.name == 'fix-verified'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # THE GATE-FROM-MAIN INVARIANT. Check out the BASE ref, never the PR head: the rules a PR is
      # judged by must not be editable by that PR. `.factory/**` and `.github/workflows/**` are on
      # the gate's MANDATORY denylist too, so even a mis-wired checkout escalates rather than merges.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # The gate itself, from the plugin — versioned independently of the repo it judges.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FACTORY_PLUGIN_REPO }}
          ref: ${{ env.FACTORY_PLUGIN_REF }}
          path: .factory-plugin
          token: ${{ secrets.FACTORY_GH_TOKEN }}
          persist-credentials: false

      # THE DRAFT DEADLOCK. `factory-issue-fix` opens a DRAFT (its write ladder deliberately ends
      # there), and a draft PR reports `mergeStateStatus: DRAFT`, which gate condition 8 rejects —
      # so without this step the factory can NEVER land anything it produced. Readying is safe and
      # reversible, and it happens only AFTER a human applied `fix-verified`, which IS the approval
      # to land. If the gate then refuses, the PR is converted back to a draft below.
      - name: Ready the draft (fix-verified is the human's approval to land)
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_REPO: ${{ github.repository }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [ "$IS_DRAFT" = "true" ]; then
            gh pr ready "$PR_NUMBER" --repo "$TARGET_REPO"
            echo "Converted #$PR_NUMBER from draft to ready so the gate can read a real merge state."
          fi

      # Condition 9's evidence arrives ONLY as an artifact from the unprivileged `fixture-evidence`
      # job (#64) — never from the fix agent, and never from a file the PR committed (this job
      # checked out the BASE ref, so PR-authored files are not present here by construction).
      #
      # The artifact belongs to the PR's own `pull_request` run, a DIFFERENT workflow run from this
      # one, so it is resolved by head SHA with gh rather than actions/download-artifact. Downloading
      # is not executing: the file is read as data by build-input.mjs, and a missing artifact simply
      # leaves condition 9 to fail closed on "no fixture evidence supplied", which is correct.
      #
      # requireFixtureEvidence stays FALSE in shipped configs until a repo's reproduction harness is
      # real; flipping it before then fails every PR at condition 9.
      - name: Download the fixture evidence (if the producer ran)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          run_id="$(gh run list --repo "$TARGET_REPO" --commit "$HEAD_SHA" --event pull_request --json databaseId --limit 1 --jq '.[0].databaseId')"
          if [ -z "${run_id:-}" ] || [ "$run_id" = "null" ]; then
            echo "No pull_request run for $HEAD_SHA — condition 9 fails closed if it is required."
            exit 0
          fi
          gh run download "$run_id" --repo "$TARGET_REPO" --name factory-evidence --dir . || \
            echo "No factory-evidence artifact on run $run_id — condition 9 fails closed if required."
          if [ -f factory-evidence.json ]; then echo "Evidence downloaded from run $run_id."; fi

      - name: Build the gate input
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          set -euo pipefail
          node .factory-plugin/packages/factory-gate/bin/build-input.mjs \
            --pr "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --base "${{ github.event.pull_request.base.ref }}" \
            --out gate-input.json \
            $( [ -f factory-evidence.json ] && echo "--evidence factory-evidence.json" )

      # Exit 0 = merge, 2 = escalate, 1 = the gate itself broke. Three DISTINCT codes on purpose:
      # "the gate broke" must never be read as either answer.
      #
      # ⚠️ `|| code=$?` IS LOAD-BEARING. GitHub runs `run:` blocks as `bash -e {0}`, and
      # `set -uo pipefail` does NOT clear that inherited `-e`. Without the `||`, the normal
      # ESCALATE path (exit 2) aborts this step before the code is captured, which then skips the
      # comment and escalate steps via their implicit `success()` — so the gate would post no
      # verdict and apply no label exactly when it says NO. Do not "simplify" this away.
      - name: Run the gate
        id: gate
        run: |
          set -uo pipefail
          CONFIG_ARG=""
          # `.factory/gate.json` in this working tree came from the BASE checkout above.
          [ -f .factory/gate.json ] && CONFIG_ARG="--config .factory/gate.json"
          code=0
          node .factory-plugin/packages/factory-gate/bin/gate.mjs \
            --input gate-input.json $CONFIG_ARG \
            --config-source "${{ github.event.pull_request.base.ref }}@${{ github.sha }}" \
            --verdict-out verdict.json --comment-out comment.md || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Gate exit: $code (0=merge, 2=escalate, 1=the gate itself broke)"

      # `always()` so the audit comment is posted even if the gate step itself died — a PR must
      # never be left with no explanation of why the factory did not land it.
      - name: Post the audit comment
        if: always() && steps.gate.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          set -euo pipefail
          [ -f comment.md ] || printf '### Factory gate — ⛔ escalate\n\nThe gate could not produce a verdict (exit %s).\n' \
            "${{ steps.gate.outputs.code }}" > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body-file comment.md

      - name: Squash-merge (only on a clean pass)
        if: steps.gate.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          set -euo pipefail
          # No --admin (it would bypass the very protections the gate mirrors) and no
          # --delete-branch (a predecessor in a stack may still need the ref).
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --squash

      - name: Escalate
        if: always() && steps.gate.conclusion != 'skipped' && steps.gate.outputs.code != '0'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_REPO: ${{ github.repository }}
          WAS_DRAFT: ${{ github.event.pull_request.draft }}
          GATE_CODE: ${{ steps.gate.outputs.code }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --repo "$TARGET_REPO" --add-label needs-you || true
          # Put it back in draft so the write ladder still ends at a draft when the gate says no.
          if [ "$WAS_DRAFT" = "true" ]; then
            gh pr ready "$PR_NUMBER" --repo "$TARGET_REPO" --undo || true
          fi
          if [ "$GATE_CODE" = "1" ]; then
            echo "::error::The factory gate FAILED TO RUN (exit 1). This is not a verdict — investigate before re-running."
            exit 1
          fi
          echo "::notice::Gate escalated (exit 2) — see the audit comment on the PR. Merged nothing."
