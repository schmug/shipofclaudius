name: CI

# Run the offline test suite on every push to main and on every PR.
# The suite (see package.json "test") is pure Node built-ins — no runtime or
# dev dependencies and no lockfile — so there is intentionally NO install step:
# `npm ci` would fail without a lockfile, and there is nothing to install.
on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Active LTS lines. The tests use only stable Node built-ins, so the
        # matrix is cheap insurance against a version-specific regression.
        node-version: [20, 22]
    name: test (Node ${{ matrix.node-version }})
    steps:
      # Third-party actions are pinned to full commit SHAs (not mutable tags)
      # so a compromised or retagged upstream can't inject code into CI.
      # Bump these via the github-actions Dependabot config (.github/dependabot.yml).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          # No cache: caching requires a lockfile, and this project has none.
      - run: npm test
